# Existing isolated staging resources; no production domains, database or secrets.
# Preserve the approved paid database and its existing storage configuration.
services:
  - type: web
    name: landwolf-premium-staging
    runtime: docker
    plan: free
    region: oregon
    branch: staging
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    # Free services do not have pre-deploy commands. Only this isolated staging
    # container runs the explicit, transaction-locked migration before serving.
    dockerCommand: /bin/sh /app/landwolf/start_staging.sh
    envVars:
      - key: LANDWOLF_ENVIRONMENT
        value: staging
      - key: LANDWOLF_PAYMENTS_ENABLED
        value: "false"
      - key: LANDWOLF_MAIL_PROVIDER
        value: disabled
      - key: LANDWOLF_DATABASE_URL
        fromDatabase:
          name: landwolf-premium-staging-db
          property: connectionString
databases:
  - name: landwolf-premium-staging-db
    databaseName: landwolf_staging
    user: landwolf_staging
    plan: 0.1c-256mb
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    postgresMajorVersion: "18"
    region: oregon
    ipAllowList: []

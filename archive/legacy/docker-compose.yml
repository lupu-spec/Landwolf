services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: property_intelligence
      POSTGRES_USER: property
      POSTGRES_PASSWORD: property
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property -d property_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:

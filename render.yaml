# Current production service; reuse the existing service and database.
# Automatic deploys and Blueprint sync remain off. Never create replacement resources.
services:
  - type: web
    name: landwolf-production
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    preDeployCommand: python -m landwolf.cli init-db
    maxShutdownDelaySeconds: 30
    domains:
      - landwolf.ai
      - www.landwolf.ai
    envVars:
      - key: LANDWOLF_ENVIRONMENT
        value: production
      # Preserve the explicitly configured dashboard value across Blueprint syncs.
      # Set true only after the live-billing activation checklist is complete.
      - key: LANDWOLF_PAYMENTS_ENABLED
        sync: false
      - key: LANDWOLF_PUBLIC_ORIGIN
        value: https://landwolf.ai
      - key: LANDWOLF_ADDITIONAL_ORIGINS
        value: '["https://www.landwolf.ai","https://landwolf-free-beta.onrender.com"]'
      - key: LANDWOLF_DATABASE_URL
        fromDatabase:
          name: landwolf-beta-db
          property: connectionString
databases:
  - name: landwolf-beta-db
    databaseName: landwolf_beta
    user: landwolf_beta
    plan: basic-256mb
    region: oregon
    ipAllowList: []

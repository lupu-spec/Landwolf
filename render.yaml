services:
  - type: web
    name: landwolf
    runtime: python
    region: ohio
    plan: free
    branch: main

    buildCommand: pip install -r requirements.txt

    preDeployCommand: alembic upgrade head

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: CORS_ORIGINS
        value: https://landwolf.ai

      - key: COOKIE_SECURE
        value: "true"

      - key: COOKIE_HTTPONLY
        value: "true"

      - key: COOKIE_SAMESITE
        value: strict

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_MONTHLY_PRICE_ID
        value: price_1UF0wdPhxY7l1SSNacgAt3xi

      - key: STRIPE_ANNUAL_PRICE_ID
        value: price_1UF0wcPhxY7l1SSNtwo6diAI

      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: STRIPE_SUCCESS_URL
        value: https://landwolf.ai/?checkout=success

      - key: STRIPE_CANCEL_URL
        value: https://landwolf.ai/?checkout=cancel

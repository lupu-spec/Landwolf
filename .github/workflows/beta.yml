name: LandWolf beta gates

on:
  pull_request:
  push:
    branches: [codex/landwolf-beta-rebuild]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: beta/package-lock.json
      - name: Install locked environments
        run: |
          pip install uv==0.12.11
          uv sync --frozen --dev
          npm ci
          .venv/bin/playwright install --with-deps chromium
      - name: Format
        run: |
          .venv/bin/ruff format --check landwolf tests scripts
          npm run format:check
      - name: Lint
        run: |
          .venv/bin/ruff check landwolf tests scripts
          npm run lint
      - name: Types
        run: |
          .venv/bin/mypy landwolf
          npm run typecheck
      - name: Unit and API integration
        run: .venv/bin/pytest -q -m 'not browser'
      - name: Browser journey
        run: |
          npm run build
          .venv/bin/pytest -q -m browser
      - name: Production package
        run: |
          .venv/bin/python -m build
          .venv/bin/python scripts/check_package.py
      - name: Security
        run: |
          .venv/bin/bandit -r landwolf
          .venv/bin/pip-audit --local --skip-editable
          npm audit --audit-level=moderate
          npm run secrets
      - name: Diff integrity
        run: |
          git diff --check
          git status --short
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-browser-evidence
          path: beta/test-results/
          retention-days: 7

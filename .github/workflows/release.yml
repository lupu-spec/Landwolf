name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      APP_ENV: ${{ inputs.environment }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      JWT_EXPIRE_MINUTES: ${{ vars.JWT_EXPIRE_MINUTES }}
      COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
      COOKIE_HTTPONLY: ${{ vars.COOKIE_HTTPONLY }}
      COOKIE_SAMESITE: ${{ vars.COOKIE_SAMESITE }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_SUCCESS_URL: ${{ vars.STRIPE_SUCCESS_URL }}
      STRIPE_CANCEL_URL: ${{ vars.STRIPE_CANCEL_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/deployment_preflight.py --environment "${{ inputs.environment }}"

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy application
        run: |
          echo "Replace with your platform-specific deployment command."
          echo "This step must exit non-zero if deployment fails."

post_deploy_smoke:
  needs: deploy
  runs-on: ubuntu-latest
  environment: ${{ inputs.environment }}
  env:
    SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
    SMOKE_ALLOWED_ORIGIN: ${{ vars.CORS_PRIMARY_ORIGIN }}
    SMOKE_BLOCKED_ORIGIN: https://blocked-smoke-origin.example
    SMOKE_TIMEOUT_SECONDS: "15"
    SMOKE_TEST_EMAIL_DOMAIN: ${{ vars.SMOKE_TEST_EMAIL_DOMAIN }}
    STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
    STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install "httpx==0.28.1"
    - name: Verify core live deployment
      run: python scripts/post_deploy_smoke.py
    - name: Verify Stripe subscription lifecycle
      run: python scripts/post_deploy_subscription_smoke.py

release_healthy:
  needs: post_deploy_smoke
  runs-on: ubuntu-latest
  steps:
    - run: echo "Release is healthy only after preflight, deploy, core smoke, and subscription smoke tests pass."

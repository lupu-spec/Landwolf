name: LandWolf hosted release checks

on:
  pull_request:
    branches: [staging, main]
    paths: [RELEASES.md]
  push:
    branches: [staging, main]
    paths:
      - RELEASES.md
      - app/scripts/check_hosted_staging.py
      - app/landwolf/version.py
      - .github/workflows/staging-smoke.yml

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked test tools
        run: |
          pip install uv==0.12.11
          uv sync --frozen --dev
          .venv/bin/playwright install --with-deps chromium webkit
      - name: Validate staging smoke script
        run: |
          .venv/bin/ruff format --check scripts/check_hosted_staging.py
          .venv/bin/ruff check scripts/check_hosted_staging.py
      - name: Check the exact deployed release
        env:
          TARGET_ENVIRONMENT: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'production' || 'staging' }}
        run: |
          EXPECTED_COMMIT=$(python - "$TARGET_ENVIRONMENT" <<'PYCODE'
          import re
          import sys
          from pathlib import Path
          label = "Production" if sys.argv[1] == "production" else "Staging"
          row = next(line for line in Path("../RELEASES.md").read_text().splitlines() if line.startswith(f"| {label} |"))
          print(re.search(r"`([0-9a-f]{40})`", row).group(1))
          PYCODE
          )
          .venv/bin/python scripts/check_hosted_staging.py --environment "$TARGET_ENVIRONMENT" --commit "$EXPECTED_COMMIT"
      - name: Public SEO acceptance
        env:
          TARGET_ENVIRONMENT: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'production' || 'staging' }}
        run: .venv/bin/python scripts/check_public_seo.py --environment "$TARGET_ENVIRONMENT"
      - name: Hosted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-staging-evidence
          path: app/test-results/hosted-staging/
          retention-days: 7

name: Temporary format diagnosis
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/transparent-feedback-trial-20261013
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Show homepage prettier differences
        run: |
          cp web/index.html /tmp/original-homepage.html
          ./node_modules/.bin/prettier --write web/index.html
          diff -u /tmp/original-homepage.html web/index.html || true

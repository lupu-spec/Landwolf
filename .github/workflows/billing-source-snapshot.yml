name: Billing source snapshot
on:
  push:
    branches: [codex/landwolf-live-billing]
    paths: [.github/workflows/billing-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output=landwolf-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: landwolf-billing-source
          path: landwolf-source.tar.gz
          retention-days: 1

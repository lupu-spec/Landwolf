name: Hunt save staging diagnostic

on:
  workflow_dispatch:
  push:
    branches: [codex/landwolf-hunt-save-fix]
    paths:
      - .github/workflows/hunt-save-diagnostic.yml
      - beta/scripts/check_hunt_save.py
      - beta/scripts/check_hunt_save_browser.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test isolated staging persistence
        run: |
          set -o pipefail
          mkdir -p diagnostics
          python beta/scripts/check_hunt_save.py | tee diagnostics/hunt-save-api.json
      - name: Install pinned browser tooling
        working-directory: beta
        run: |
          pip install uv==0.12.11
          uv sync --frozen --dev
          .venv/bin/playwright install --with-deps chromium webkit
      - name: Observe browser save and edit persistence
        run: |
          set -o pipefail
          beta/.venv/bin/python beta/scripts/check_hunt_save_browser.py | tee diagnostics/hunt-save-browser.json
      - name: Collect exact test source
        if: always()
        run: git archive --format=zip --output=diagnostics/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunt-save-diagnostic
          path: diagnostics/
          retention-days: 3

name: LandWolf live smoke

on:
  workflow_dispatch:
  push:
    branches: [codex/landwolf-beta-rebuild, codex/landwolf-premium-staging]
    paths: [RELEASES.md]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check live versions and fallback image over HTTPS
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import time
          import urllib.request
          from pathlib import Path

          ledger = Path("RELEASES.md").read_text()
          expected_image = hashlib.sha256(
              Path("beta/web/assets/no-photo-available.png").read_bytes()
          ).hexdigest()

          expected_logo = hashlib.sha256(
              Path("beta/web/assets/landwolf-logo.jpg").read_bytes()
          ).hexdigest()

          def fetch(url):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          assert response.status == 200, (url, response.status)
                          return response.read()
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2 * (attempt + 1))

          for environment, site in (
              ("Production", "https://landwolf.ai"),
              ("Beta", "https://landwolf-premium-staging.onrender.com"),
          ):
              line = next(
                  line for line in ledger.splitlines()
                  if line.startswith(f"| {environment} |")
              )
              version = re.search(r"v\d+\.\d+\.\d+(?:-beta\.\d+)?", line).group()
              commit = re.search(r"`([0-9a-f]{40})`", line).group(1)
              payload = json.loads(fetch(f"{site}/api/version"))
              assert payload["version"] == version[1:], (site, payload)
              assert payload["commit"] == commit, (site, payload)
              health = json.loads(fetch(f"{site}/api/health"))
              assert health["status"] == "ok", (site, health)
              assert health["version"] == version[1:], (site, health)
              if environment == "Beta":
                  html = fetch(site).decode("utf-8")
                  assert 'id="hunt-budget-label"' in html
                  assert 'id="hunt-cancel"' in html
              html = fetch(site).decode("utf-8")
              assert '/assets/landwolf-logo.jpg' in html, site
              logo = fetch(f"{site}/assets/landwolf-logo.jpg")
              assert hashlib.sha256(logo).hexdigest() == expected_logo, site
              print(f"{environment}: exact supplied logo verified")
              image = fetch(f"{site}/assets/no-photo-available.png")
              assert hashlib.sha256(image).hexdigest() == expected_image, site
              print(f"{environment}: {version} {commit}, fallback image verified")
              if environment == "Production":
                  production_version = version[1:]

          www = json.loads(fetch("https://www.landwolf.ai/api/version"))
          assert www["version"] == production_version, www
          print("www.landwolf.ai: HTTPS version endpoint verified")
          PY

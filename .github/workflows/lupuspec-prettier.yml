name: LupuSpec one-time Prettier formatting
on:
  push:
    branches:
      - feat/lupuspec-portal-crm-finance-20261103
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lupuspec-portal-crm-finance-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned formatting tools
        working-directory: app
        run: npm ci
      - name: Format only five LupuSpec frontend files
        working-directory: app
        run: npx prettier --write web/crm.ts web/finance.ts web/lupuspec.css web/lupuspec.html web/lupuspec.ts
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- app/web/crm.ts app/web/finance.ts app/web/lupuspec.css app/web/lupuspec.html app/web/lupuspec.ts; then
            echo "All frontend files already match Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/crm.ts app/web/finance.ts app/web/lupuspec.css app/web/lupuspec.html app/web/lupuspec.ts
          git commit -m "style(lupuspec): format frontend with pinned Prettier"
          git push origin HEAD:feat/lupuspec-portal-crm-finance-20261103
